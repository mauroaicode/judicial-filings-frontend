<div class="flex h-screen min-h-0 overflow-hidden bg-base-200">
  <!-- Sidebar -->
  <app-sidebar #sidebar></app-sidebar>

  <!-- Main Content Area -->
  <div
    class="flex h-full min-h-0 flex-1 flex-col min-w-0 transition-all duration-300"
    [class.ml-64]="sidebar?.isOpen() && !sidebar?.isMobile()"
    [class.ml-16]="!sidebar?.isOpen() && !sidebar?.isMobile()"
  >
    <!-- Header (fuera del scroll de main) -->
    <div class="relative z-[100] shrink-0">
      <app-header [pageTitle]="pageTitle()" (toggleSidebar)="onToggleSidebar()"></app-header>
    </div>

    <!-- Page Content -->
    <main class="authenticated-main flex min-h-0 flex-1 flex-col overflow-y-auto overscroll-y-contain p-4 md:p-6">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- WebSocket Notifications Listener -->
  <app-notifications></app-notifications>
</div>
