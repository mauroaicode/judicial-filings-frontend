<div class="relative date-picker">
  <input
    #dateInput
    type="text"
    [class]="
      getInputSizeClass() +
      ' input input-bordered w-full date-picker-input ' +
      (hasError() ? 'input-error' : '')
    "
    [placeholder]="placeholder()"
    [disabled]="disabled() || isDisabled()"
    (blur)="onBlur()"
    readonly
  />
  <div class="absolute right-2 top-1/2 -translate-y-1/2 flex items-center gap-1">
    @if (allowClear() && currentValue() && !disabled() && !isDisabled()) {
      <button
        type="button"
        class="btn btn-ghost btn-xs btn-circle text-base-content/40 hover:text-error"
        (click)="onClear($event)"
        [attr.aria-label]="'Limpiar fecha'"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    }
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-5 w-5 text-base-content/50 pointer-events-none"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="2"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
      />
    </svg>
  </div>
</div>
