<dialog
  class="app-bottom-sheet-modal modal modal-bottom lg:modal-middle"
  [class.modal-open]="open()"
  [attr.aria-modal]="open() ? true : null"
  (cancel)="onNativeCancel($event)"
>
  <div
    class="app-bottom-sheet-modal__box modal-box flex w-full max-w-2xl flex-col overflow-hidden rounded-t-[1.75rem] rounded-b-none p-0 lg:max-h-[min(90vh,560px)] lg:rounded-2xl lg:rounded-b-2xl"
  >
    <div class="app-bottom-sheet-modal__scroll min-h-0 flex-1 overflow-y-auto px-4 pb-4 pt-5 sm:p-6 lg:pt-6">
      @if (showMobileHandle()) {
        <div class="mx-auto mb-3 h-1.5 w-12 shrink-0 rounded-full bg-base-300 lg:hidden" aria-hidden="true"></div>
      }
      <ng-content select=".bottom-sheet-body"></ng-content>
    </div>
    <ng-content select=".bottom-sheet-footer"></ng-content>
  </div>

  <form
    method="dialog"
    class="modal-backdrop"
    [ngClass]="backdropClass()"
    [attr.aria-label]="backdropAriaLabel() || null"
    (click)="onBackdropActivate()"
  ></form>
</dialog>
